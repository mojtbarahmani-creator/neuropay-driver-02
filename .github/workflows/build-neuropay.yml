
name: Build NeuroPay APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create NeuroPay project files
        shell: bash
        run: |
          mkdir -p app/src/main/java/ir/neuropay/app
          mkdir -p app/src/main

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NeuroPay"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.6.1" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "ir.neuropay.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "ir.neuropay.app"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:label="نوروپی"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/ir/neuropay/app/MainActivity.kt <<'EOF'
          package ir.neuropay.app

          import android.app.Activity
          import android.app.AlertDialog
          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          class MainActivity : Activity() {
              private var balance = 1_000_000L
              private lateinit var root: LinearLayout

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  showHome()
              }

              private fun setup(title: String) {
                  root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutDirection = View.LAYOUT_DIRECTION_RTL
                      setPadding(24, 28, 24, 24)
                      setBackgroundColor(Color.rgb(245, 248, 250))
                  }
                  val scroll = ScrollView(this)
                  scroll.addView(root)
                  setContentView(scroll)
                  addText(title, 26, Color.rgb(20, 45, 75))
              }

              private fun addText(
                  value: String,
                  size: Int = 18,
                  color: Int = Color.BLACK
              ) {
                  root.addView(TextView(this).apply {
                      text = value
                      textSize = size.toFloat()
                      setTextColor(color)
                      gravity = Gravity.RIGHT
                      setPadding(4, 12, 4, 12)
                  })
              }

              private fun addButton(label: String, action: () -> Unit) {
                  root.addView(Button(this).apply {
                      text = label
                      isAllCaps = false
                      setOnClickListener { action() }
                  })
              }

              private fun message(text: String) {
                  AlertDialog.Builder(this)
                      .setTitle("نوروپی")
                      .setMessage(text)
                      .setPositiveButton("باشه", null)
                      .show()
              }

              private fun showHome() {
                  setup("نوروپی")
                  addText("موجودی آزمایشی کیف پول")
                  addText("%,d تومان".format(balance), 30, Color.rgb(0, 120, 110))
                  addText("نسخه نمایشی؛ انتقال واقعی پول انجام نمی‌شود.", 14)
                  addButton("پرداخت آزمایشی") { showPayment() }
                  addButton("واریز به حساب جهت برداشت پول از کیف پول") {
                      showWithdrawal()
                  }
                  addButton("تاریخچه تراکنش‌ها") {
                      setup("تاریخچه تراکنش‌ها")
                      addText("تاریخچه در این نسخه ذخیره دائمی نمی‌شود.")
                      addButton("بازگشت") { showHome() }
                  }
              }

              private fun showPayment() {
                  setup("پرداخت آزمایشی")
                  val receiver = EditText(this).apply {
                      hint = "نام پذیرنده"
                      setText("پذیرنده آزمایشی")
                  }
                  val amount = EditText(this).apply {
                      hint = "مبلغ به تومان"
                      inputType = 2
                  }
                  root.addView(receiver)
                  root.addView(amount)

                  addButton("ثبت پرداخت آزمایشی") {
                      val value = amount.text.toString().toLongOrNull()
                      when {
                          value == null || value <= 0 ->
                              message("مبلغ معتبر وارد کن.")
                          value > balance ->
                              message("موجودی کافی نیست.")
                          else -> AlertDialog.Builder(this)
                              .setTitle("تأیید پرداخت")
                              .setMessage("پرداخت آزمایشی $value تومان ثبت شود؟")
                              .setNegativeButton("لغو", null)
                              .setPositiveButton("تأیید") { _, _ ->
                                  balance -= value
                                  message("پرداخت فقط در نسخه آزمایشی ثبت شد.")
                                  showHome()
                              }
                              .show()
                      }
                  }
                  addButton("بازگشت") { showHome() }
              }

              private fun showWithdrawal() {
                  setup("برداشت از کیف پول")
                  addText("واریز به حساب جهت برداشت پول از کیف پول")
                  addText("موجودی نمایشی: %,d تومان".format(balance))

                  val amount = EditText(this).apply {
                      hint = "مبلغ برداشت به تومان"
                      inputType = 2
                  }
                  val sheba = EditText(this).apply {
                      hint = "شماره شبا: IR و ۲۴ رقم"
                  }
                  root.addView(amount)
                  root.addView(sheba)

                  addButton("ثبت درخواست آزمایشی برداشت") {
                      val value = amount.text.toString().toLongOrNull()
                      val iban = sheba.text.toString()
                          .replace(" ", "")
                          .uppercase()

                      when {
                          value == null || value <= 0 ->
                              message("مبلغ معتبر وارد کن.")
                          value > balance ->
                              message("موجودی کافی نیست.")
                          !iban.matches(Regex("IR[0-9]{24}")) ->
                              message("شماره شبا باید با IR و ۲۴ رقم باشد.")
                          else ->
                              message(
                                  "فرم آزمایشی بررسی شد. پولی به بانک ارسال نشده و موجودی تغییر نکرده است."
                              )
                      }
                  }
                  addButton("بازگشت") { showHome() }
              }
          }
          EOF

          cat > README.md <<'EOF'
          # نوروپی (NeuroPay)

          نسخه نمایشی اندروید برای آزمایش رابط کیف پول.

          ## ساخت APK
          در GitHub به بخش Actions بروید و اجرای Build NeuroPay APK را انتخاب کنید.
          پس از پایان موفق، فایل APK را از بخش Artifacts دریافت کنید.

          ## توجه مهم
          این برنامه صرفاً نمایشی است. موجودی واقعی نیست و به بانک یا سامانه پرداخت متصل نیست.
          پرداخت‌ها و درخواست برداشت واقعی انجام نمی‌شوند. برای استفاده مالی واقعی،
          به سرور امن، احراز هویت، کنترل تراکنش و اتصال قانونی به ارائه‌دهنده پرداخت نیاز است.
          EOF

          cat > .gitignore <<'EOF'
          .gradle/
          build/
          app/build/
          local.properties
          *.iml
          .idea/
          EOF

      - name: Save project files to GitHub
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add settings.gradle.kts build.gradle.kts gradle.properties app README.md .gitignore
          if ! git diff --cached --quiet; then
            git commit -m "Create NeuroPay Android demo project"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeuroPay-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
